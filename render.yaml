services:
  - type: web
    name: snapstudy
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt && cd web && npm ci && npm run build
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/snapstudy.db
      - key: PORTAL_SECRET
        generateValue: true
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: PORTAL_BASE_URL
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: GEMMA_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: GEMMA_MODEL
        value: google/gemma-4-31b-it:free
      - key: LOG_LEVEL
        value: INFO
      - key: PORTAL_TOKEN_TTL_SECONDS
        value: "86400"
      - key: PORTAL_SESSION_DAYS
        value: "7"
